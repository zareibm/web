# Base44 development environment for Horizon Properties.
#
# Runs the Vite dev server straight from the cloned source (bind-mounted), so
# every edit is reflected without an image rebuild. There is no prebuilt
# application image here on purpose.

name: horizon-properties

services:
  web:
    image: node:22
    working_dir: /app
    # node_modules lives in a named volume (not the bind mount) so the host
    # checkout stays clean; the lockfile is synced on every start.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - '3000:3000'
    environment:
      # Set by the platform; Vite appends this to its allowed host list.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      # Node 22 ships a global fetch; the dev server must actually answer.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 150s
    restart: on-failure
    labels:
      base44.project: Horizon Properties
      base44.kind: web
      base44.port: '3000'

volumes:
  node_modules:
